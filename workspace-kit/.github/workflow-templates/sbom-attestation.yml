name: SBOM & Attestation

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    outputs:
      sbom: ${{ steps.sbom.outputs.sbom }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        id: sbom
        with:
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30

  attest:
    needs: sbom
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: .
      - name: Generate attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: sbom.spdx.json
          subject-name: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: attestation
          path: *.intoto.jsonl